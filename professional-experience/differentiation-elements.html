<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Differentiation Elements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #102528;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .frame {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 1.5rem;
  }

  .caption {
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    color: #003d44;
    letter-spacing: -0.005em;
    margin: 0;
  }
  .caption-top { margin-bottom: 1rem; }
  .caption-bottom { margin-top: 1rem; }

  svg.diagram {
    display: block;
    width: 100%;
    height: auto;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .el-box { cursor: pointer; }
  .el-box rect.box-bg { transition: opacity 0.22s ease, filter 0.22s ease; }
  .el-box text { pointer-events: none; }

  .connector {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: opacity 0.25s ease, stroke-width 0.2s ease;
  }
  .diagram .connector { opacity: 0.6; }

  .diagram[data-active] .el-box rect.box-bg,
  .diagram[data-active] .el-box .box-text,
  .diagram[data-active] .char-box rect,
  .diagram[data-active] .char-box text {
    opacity: 0.22;
    transition: opacity 0.22s ease;
  }
  .diagram[data-active] .connector { opacity: 0.08; }

  .diagram[data-active] .el-box.is-active rect.box-bg,
  .diagram[data-active] .el-box.is-active .box-text,
  .diagram[data-active] .char-box.is-related rect,
  .diagram[data-active] .char-box.is-related text {
    opacity: 1;
  }
  .diagram[data-active] .connector.is-active {
    opacity: 1;
    stroke-width: 4.5;
  }

  .diagram:not([data-active]) .el-box:hover rect.box-bg {
    filter: brightness(1.05);
  }

  .el-box:focus { outline: none; }
  .el-box:focus-visible rect.box-bg {
    stroke: #003d44;
    stroke-width: 3;
  }

  @media (prefers-reduced-motion: reduce) {
    *, .el-box rect.box-bg, .connector { transition: none !important; }
  }

  @media (max-width: 540px) {
    .frame { padding: 0.75rem 0.5rem 1rem; }
    .caption { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="frame">

  <p class="caption caption-top">Classroom elements</p>

  <svg class="diagram" viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of differentiation elements showing how Content, Process, Product, and Learning Environment connect to student characteristics: Readiness, Interests, and Learning profile.">

    <defs>
      <style>
        .clr-content { fill: #2a8a93; }
        .clr-process { fill: #006d77; }
        .clr-product { fill: #cc6b3a; }
        .clr-env     { fill: #b3d3d6; }
        .clr-char    { fill: #003d44; }

        /* Top accent bars — darker shade of each box's own colour */
        .accent-content { fill: #1b6a72; }
        .accent-process { fill: #00525a; }
        .accent-product { fill: #a85528; }
        .accent-env     { fill: #8eb8bd; }

        .stroke-content { stroke: #2a8a93; }
        .stroke-process { stroke: #006d77; }
        .stroke-product { stroke: #cc6b3a; }
        .stroke-env     { stroke: #8eb8bd; }

        .box-text { fill: #ffffff; }
        .box-text-heading {
          font-weight: 700;
          font-size: 23px;
          letter-spacing: -0.015em;
        }
        .box-text-body {
          font-weight: 500;
          font-size: 13px;
        }
        .box-text-env, .box-text-env-body { fill: #003d44; }

        .char-text {
          fill: #ffffff;
          font-weight: 700;
          font-size: 17px;
          letter-spacing: -0.005em;
        }
      </style>

      <!-- Subtle drop shadow for the boxes -->
      <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#003d44" flood-opacity="0.15"/>
      </filter>
    </defs>

    <!-- ===== Connectors ===== -->
    <!-- Content (centre x=118) → Readiness(160), Interests(460), Learning profile(770) -->
    <path class="connector stroke-content" data-from="content" data-to="readiness"
          d="M 118 210 L 118 260 L 160 260 L 160 400"/>
    <path class="connector stroke-content" data-from="content" data-to="interests"
          d="M 118 210 L 118 260 L 460 260 L 460 400"/>
    <path class="connector stroke-content" data-from="content" data-to="learning-profile"
          d="M 118 210 L 118 260 L 770 260 L 770 400"/>

    <!-- Process (centre x=346) → all three -->
    <path class="connector stroke-process" data-from="process" data-to="readiness"
          d="M 346 210 L 346 290 L 160 290 L 160 400"/>
    <path class="connector stroke-process" data-from="process" data-to="interests"
          d="M 346 210 L 346 290 L 460 290 L 460 400"/>
    <path class="connector stroke-process" data-from="process" data-to="learning-profile"
          d="M 346 210 L 346 290 L 770 290 L 770 400"/>

    <!-- Product (centre x=574) → all three -->
    <path class="connector stroke-product" data-from="product" data-to="readiness"
          d="M 574 210 L 574 320 L 160 320 L 160 400"/>
    <path class="connector stroke-product" data-from="product" data-to="interests"
          d="M 574 210 L 574 320 L 460 320 L 460 400"/>
    <path class="connector stroke-product" data-from="product" data-to="learning-profile"
          d="M 574 210 L 574 320 L 770 320 L 770 400"/>

    <!-- Learning environment (centre x=802) → Learning profile only -->
    <path class="connector stroke-env" data-from="environment" data-to="learning-profile"
          d="M 802 210 L 802 350 L 770 350 L 770 400"/>


    <!-- ===== Top boxes (Classroom elements) ===== -->

    <!-- Content -->
    <g class="el-box" data-el="content" tabindex="0" role="button" aria-label="Content classroom element">
      <g filter="url(#boxShadow)">
        <rect class="box-bg clr-content" x="20" y="10" width="196" height="200" rx="3"/>
      </g>
      <rect class="accent-content" x="20" y="10" width="196" height="4" rx="3"/>
      <text class="box-text box-text-heading" x="40" y="52">Content</text>
      <text class="box-text box-text-body" x="40" y="88">
        <tspan x="40" dy="0">Content can be</tspan>
        <tspan x="40" dy="20">differentiated</tspan>
        <tspan x="40" dy="20">according to</tspan>
        <tspan x="40" dy="20">readiness and/or</tspan>
        <tspan x="40" dy="20">interests and/or</tspan>
        <tspan x="40" dy="20">learning profile.</tspan>
      </text>
    </g>

    <!-- Process -->
    <g class="el-box" data-el="process" tabindex="0" role="button" aria-label="Process classroom element">
      <g filter="url(#boxShadow)">
        <rect class="box-bg clr-process" x="248" y="10" width="196" height="200" rx="3"/>
      </g>
      <rect class="accent-process" x="248" y="10" width="196" height="4" rx="3"/>
      <text class="box-text box-text-heading" x="268" y="52">Process</text>
      <text class="box-text box-text-body" x="268" y="88">
        <tspan x="268" dy="0">Process can be</tspan>
        <tspan x="268" dy="20">differentiated</tspan>
        <tspan x="268" dy="20">according to</tspan>
        <tspan x="268" dy="20">readiness and/or</tspan>
        <tspan x="268" dy="20">interests and/or</tspan>
        <tspan x="268" dy="20">learning profile.</tspan>
      </text>
    </g>

    <!-- Product -->
    <g class="el-box" data-el="product" tabindex="0" role="button" aria-label="Product classroom element">
      <g filter="url(#boxShadow)">
        <rect class="box-bg clr-product" x="476" y="10" width="196" height="200" rx="3"/>
      </g>
      <rect class="accent-product" x="476" y="10" width="196" height="4" rx="3"/>
      <text class="box-text box-text-heading" x="496" y="52">Product</text>
      <text class="box-text box-text-body" x="496" y="88">
        <tspan x="496" dy="0">Product can be</tspan>
        <tspan x="496" dy="20">differentiated</tspan>
        <tspan x="496" dy="20">according to</tspan>
        <tspan x="496" dy="20">readiness and/or</tspan>
        <tspan x="496" dy="20">interests and/or</tspan>
        <tspan x="496" dy="20">learning profile.</tspan>
      </text>
    </g>

    <!-- Learning environment -->
    <g class="el-box" data-el="environment" tabindex="0" role="button" aria-label="Learning environment classroom element">
      <g filter="url(#boxShadow)">
        <rect class="box-bg clr-env" x="704" y="10" width="196" height="200" rx="3"/>
      </g>
      <rect class="accent-env" x="704" y="10" width="196" height="4" rx="3"/>
      <text class="box-text box-text-heading box-text-env" x="724" y="42">
        <tspan x="724" dy="0">Learning</tspan>
        <tspan x="724" dy="23">environment</tspan>
      </text>
      <text class="box-text box-text-body box-text-env-body" x="724" y="108">
        <tspan x="724" dy="0">Learning</tspan>
        <tspan x="724" dy="20">environment can</tspan>
        <tspan x="724" dy="20">be differentiated</tspan>
        <tspan x="724" dy="20">according to</tspan>
        <tspan x="724" dy="20">learning profile.</tspan>
      </text>
    </g>


    <!-- ===== Bottom boxes (Student characteristics) ===== -->

    <g class="char-box" data-char="readiness">
      <g filter="url(#boxShadow)">
        <rect class="clr-char" x="60" y="400" width="200" height="50" rx="3"/>
      </g>
      <text class="char-text" x="160" y="432" text-anchor="middle">Readiness</text>
    </g>

    <g class="char-box" data-char="interests">
      <g filter="url(#boxShadow)">
        <rect class="clr-char" x="360" y="400" width="200" height="50" rx="3"/>
      </g>
      <text class="char-text" x="460" y="432" text-anchor="middle">Interests</text>
    </g>

    <g class="char-box" data-char="learning-profile">
      <g filter="url(#boxShadow)">
        <rect class="clr-char" x="660" y="400" width="220" height="50" rx="3"/>
      </g>
      <text class="char-text" x="770" y="432" text-anchor="middle">Learning profile</text>
    </g>

  </svg>

  <p class="caption caption-bottom">Student characteristics</p>

</div>

<script>
  (function () {
    const diagram = document.querySelector('svg.diagram');
    const elBoxes = diagram.querySelectorAll('.el-box');
    const charBoxes = diagram.querySelectorAll('.char-box');
    const connectors = diagram.querySelectorAll('.connector');

    function activate(elName) {
      diagram.dataset.active = elName;
      const relatedChars = new Set();
      connectors.forEach(c => {
        if (c.dataset.from === elName) {
          c.classList.add('is-active');
          relatedChars.add(c.dataset.to);
        } else {
          c.classList.remove('is-active');
        }
      });
      elBoxes.forEach(b => b.classList.toggle('is-active', b.dataset.el === elName));
      charBoxes.forEach(b => b.classList.toggle('is-related', relatedChars.has(b.dataset.char)));
    }

    function deactivate() {
      delete diagram.dataset.active;
      elBoxes.forEach(b => b.classList.remove('is-active'));
      charBoxes.forEach(b => b.classList.remove('is-related'));
      connectors.forEach(c => c.classList.remove('is-active'));
    }

    elBoxes.forEach(box => {
      box.addEventListener('mouseenter', () => activate(box.dataset.el));
      box.addEventListener('mouseleave', deactivate);
      box.addEventListener('focus', () => activate(box.dataset.el));
      box.addEventListener('blur', deactivate);
      box.addEventListener('click', () => {
        if (diagram.dataset.active === box.dataset.el) deactivate();
        else activate(box.dataset.el);
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (diagram.dataset.active === box.dataset.el) deactivate();
          else activate(box.dataset.el);
        } else if (e.key === 'Escape') {
          deactivate();
        }
      });
    });
  })();
</script>

</body>
</html>
